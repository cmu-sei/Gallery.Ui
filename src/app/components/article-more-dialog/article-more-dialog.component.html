<crucible-dialog [hideDefaultActions]="true">
  <div crucibleDialogTitle>
    {{ data.article.name }}
  </div>

  <div crucibleDialogContent>
    @if (data.useUrl && safeUrl) {
      <div class="container">
        <iframe [src]="safeUrl" class="responsive-iframe"></iframe>
      </div>
    }

    @if (!data.useUrl && data.article && data.article.description) {
      <div class="page">
        <angular-editor class="angular-editor" [ngModel]="data.article.description" [config]="editorConfig"></angular-editor>
      </div>
    }
  </div>

  <div crucibleDialogActions>
    <button mat-icon-button (click)="handleMoreIsComplete(false)" title="Cancel" tabindex="-1">
      <mat-icon class="mdi-24px center-self" fontIcon="mdi-close-circle-outline"></mat-icon>
    </button>
    <button mat-icon-button (click)="handleMoreIsComplete(true)" title="Open in new tab" tabindex="1">
      <mat-icon class="mdi-24px center-self" fontIcon="mdi-open-in-new"></mat-icon>
    </button>
  </div>
</crucible-dialog>
